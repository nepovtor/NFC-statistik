services:
  nfc_migrate:
    build: .
    container_name: nfc_app_migrate
    restart: "no"
    command: ["python", "-m", "nfc_app", "migrate"]
    environment:
      SESSION_SECRET: ${SESSION_SECRET?SESSION_SECRET is required}
      ADMIN_LOGIN: ${ADMIN_LOGIN?ADMIN_LOGIN is required}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH?ADMIN_PASSWORD_HASH is required}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8001}
      NFC_STATS_DB_PATH: ${NFC_STATS_DB_PATH:-/data/nfc_stats.db}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-0}
      TRUSTED_PROXY_NETWORKS: ${TRUSTED_PROXY_NETWORKS:-127.0.0.1/32,::1/128}
      SESSION_TOUCH_INTERVAL_MINUTES: ${SESSION_TOUCH_INTERVAL_MINUTES:-5}
      LOGIN_RATE_LIMIT_ATTEMPTS: ${LOGIN_RATE_LIMIT_ATTEMPTS:-5}
      LOGIN_RATE_LIMIT_WINDOW_MINUTES: ${LOGIN_RATE_LIMIT_WINDOW_MINUTES:-15}
      VISIT_DATA_EXPOSURE: ${VISIT_DATA_EXPOSURE:-full}
      VISIT_RETENTION_DAYS: ${VISIT_RETENTION_DAYS:-180}
    volumes:
      - ./data:/data

  nfc_app:
    build: .
    container_name: nfc_app
    restart: unless-stopped
    depends_on:
      nfc_migrate:
        condition: service_completed_successfully
    ports:
      - "8001:8001"
    command: ["python", "-m", "nfc_app", "serve"]
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/readyz', timeout=5).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      SESSION_SECRET: ${SESSION_SECRET?SESSION_SECRET is required}
      ADMIN_LOGIN: ${ADMIN_LOGIN?ADMIN_LOGIN is required}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH?ADMIN_PASSWORD_HASH is required}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8001}
      NFC_STATS_DB_PATH: ${NFC_STATS_DB_PATH:-/data/nfc_stats.db}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-0}
      TRUSTED_PROXY_NETWORKS: ${TRUSTED_PROXY_NETWORKS:-127.0.0.1/32,::1/128}
      SESSION_TOUCH_INTERVAL_MINUTES: ${SESSION_TOUCH_INTERVAL_MINUTES:-5}
      LOGIN_RATE_LIMIT_ATTEMPTS: ${LOGIN_RATE_LIMIT_ATTEMPTS:-5}
      LOGIN_RATE_LIMIT_WINDOW_MINUTES: ${LOGIN_RATE_LIMIT_WINDOW_MINUTES:-15}
      VISIT_DATA_EXPOSURE: ${VISIT_DATA_EXPOSURE:-full}
      VISIT_RETENTION_DAYS: ${VISIT_RETENTION_DAYS:-180}
    volumes:
      - ./data:/data
