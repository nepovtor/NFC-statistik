services:
  nfc_app:
    build: .
    container_name: nfc_app
    restart: unless-stopped
    ports:
      - "8001:8001"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/readyz', timeout=5).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      SESSION_SECRET: ${SESSION_SECRET?SESSION_SECRET is required}
      ADMIN_LOGIN: ${ADMIN_LOGIN?ADMIN_LOGIN is required}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH?ADMIN_PASSWORD_HASH is required}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8001}
      NFC_STATS_DB_PATH: ${NFC_STATS_DB_PATH:-/data/nfc_stats.db}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
    volumes:
      - ./data:/data
