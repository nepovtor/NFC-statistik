{% from "macros.html" import icon %}

<aside class="sidebar">
    <div class="sidebar-head">
        <div>
            <div class="brand">{{ brand }}</div>
            <div class="brand-sub">{{ brand_subtitle }}</div>
        </div>
        {% include "partials/theme_toggle.html" %}
    </div>

    <div class="nav-sections">
        {% for section in nav_sections %}
            <div class="nav-section">
                <div class="nav-section-label">{{ section.title }}</div>
                <nav class="nav">
                    {% for link in section.links %}
                        <a href="{{ link.href }}" class="nav-link{% if link.href == active_nav %} is-active{% endif %}">
                            <span class="nav-link-icon">{{ icon(link.icon, 'icon') }}</span>
                            <span class="nav-link-label">{{ link.label }}</span>
                        </a>
                    {% endfor %}
                </nav>
            </div>
        {% endfor %}
    </div>
</aside>
